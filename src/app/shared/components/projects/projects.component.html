<div class="projects">
    <div class="projects-title">
        <a>Projects</a>
    </div>
    <div class="projects-list">
        @for(project of github_projects; track project){
            <div class="project" (click)="gotoProject(project.svn_url)">
                <div class="project-head">
                    <div class="project-head-left">
                        <a>{{ project.name }}</a>
                    </div>
                    <div class="project-head-right">
                        <img draggable="false" src="../../../../assets/skills/github-auto.svg"/>
                    </div>
                </div>
                <div class="project-body">
                    <div class="project-body-stars">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="yellow" class="bi bi-star-fill" viewBox="0 0 16 16">
                            <path d="M3.612 15.443c-.386.198-.824-.149-.746-.592l.83-4.73L.173 6.765c-.329-.314-.158-.888.283-.95l4.898-.696L7.538.792c.197-.39.73-.39.927 0l2.184 4.327 4.898.696c.441.062.612.636.282.95l-3.522 3.356.83 4.73c.078.443-.36.79-.746.592L8 13.187l-4.389 2.256z"/>
                        </svg>
                        <a>{{ project.stargazers_count }}</a>
                    </div>
                </div>
                <div class="project-languages-color" style="background: {{ project.language_color }};"></div>
            </div>
        }
    </div>
</div>
